<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - AI Lawyer Bot</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
    </style>
</head>
<body>
    <h1>🤖 AI Lawyer Bot - Admin Panel</h1>
    <h2>Users List</h2>
    <table id="users-table">
        <thead>
            <tr><th>Telegram ID</th><th>Name</th><th>Requests</th><th>Registered</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        fetch('/api/users')
            .then(r => r.json())
            .then(users => {
                const tbody = document.querySelector('#users-table tbody');
                users.forEach(u => {
                    const row = `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.requests}</td><td>${u.registered}</td></tr>`;
                    tbody.innerHTML += row;
                });
            });
    </script>
</body>
</html>
